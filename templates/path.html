<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ prefix }}static/learning_path.css">
</head>
<body>
  <header class="lp-header">
    <a href="{{ prefix }}{{ 'index.html' if prefix == '' else '' }}"><img class="logo" src="{{ prefix }}static/fair4chemnl-logo.png" alt="FAIR4ChemNL logo"></a>
    <h1>{{ title }}</h1>
  </header>
  <div id="chart"></div>
  {% if citation and citation[0] %}
  <p class="lp-citation">Based on: {{ citation[0] }}{% if citation[1] %} <a href="{{ citation[1] }}">{{ citation[1] }}</a>{% endif %}</p>
  {% endif %}
  {% include "footer.html" %}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="{{ prefix }}static/learning_path.js"></script>
  <script>
    document.fonts.ready.then(() => {
      LearningPath.render("#chart", "{{ data_url }}")
        .catch((e) => { document.getElementById("chart").textContent = e.message; });
    });
  </script>
</body>
</html>
